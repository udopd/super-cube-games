<!DOCTYPE html>
<html data-theme="light" lang="ru">
<head>
  <meta charset="utf-8" />
  <script>(()=>{try{const t=localStorage.getItem('supercube-theme');document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const l=localStorage.getItem('supercube-lang');if(l==='ru'||l==='en')document.documentElement.lang=l}catch{}})();</script>
  <meta content="width=device-width,initial-scale=1" name="viewport" />
  <meta content="noindex,nofollow" name="robots" />
  <meta name="referrer" content="no-referrer" />
  <title>Сброс пароля | SUPER CUBE Games</title>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml" /><link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <header class="topbar"><div class="container topbar-inner"><a class="brand" href="/">SUPER CUBE</a><div class="header-actions"><a class="text-link" href="/login.html" data-i18n="backToLogin">Назад ко входу</a><button class="control" id="languageToggle" type="button">RU</button><button class="control" id="themeToggle" type="button">◐</button></div></div></header>
  <main class="container auth-layout"><section class="auth-intro"><h1 data-i18n="resetTitle">Новый<br />пароль.</h1><p data-i18n="resetIntro">Создай новый пароль для своего аккаунта.</p></section>
    <section class="auth-card"><h2 data-i18n="resetHeading">Сброс пароля</h2>
      <form id="resetPasswordForm"><div class="form-field"><label for="resetPassword" data-i18n="newPassword">Новый пароль</label><input class="field" id="resetPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required /></div><div class="password-strength" aria-live="polite"><div class="password-strength-track" role="meter" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><div class="password-strength-fill" id="passwordStrengthFill"></div></div><span id="passwordStrengthLabel" class="small muted" data-i18n="passwordMinHint">Минимум 6 символов</span></div><div class="form-field" style="margin-top:14px"><label for="resetPasswordConfirm" data-i18n="confirmPassword">Повтори пароль</label><input class="field" id="resetPasswordConfirm" type="password" minlength="6" maxlength="128" autocomplete="new-password" required /></div><button class="auth-button primary" type="submit" data-i18n="saveNewPassword">Сохранить новый пароль</button></form>
      <p id="resetMessage" class="auth-message" role="status" aria-live="polite"></p><a id="resetBackLink" class="text-link hidden" href="/login.html" data-i18n="backToLogin">Назад ко входу</a>
    </section></main>
  <script defer src="/js/common.js"></script><script defer src="/js/reset-password.js"></script>
</body>
</html>
